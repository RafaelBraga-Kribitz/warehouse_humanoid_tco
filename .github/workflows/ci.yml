name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies (locked)
        run: |
          uv sync --frozen --extra dev --extra analytics
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
      - name: Black
        run: black --check src/ tests/ scripts/
      - name: Ruff
        run: ruff check src/ tests/ scripts/
      - name: Pyright
        run: pyright src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies (locked)
        run: |
          uv sync --frozen --extra dev --extra analytics
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
      - name: Generate simulation data (required for F-044 verification)
        run: python -m warehouse_humanoid_tco.pipelines.module_02_simulation
      - name: Run tests
        run: pytest tests/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t warehouse-humanoid-tco:test .
      # F-042: invoke the image as the Dockerfile defines it — the entrypoint
      # is `python -m warehouse_humanoid_tco` — so we exercise the real CLI
      # the user runs rather than overriding ENTRYPOINT with a no-op import.
      - name: Smoke test in container
        run: docker run --rm warehouse-humanoid-tco:test --help

  # F-041: exercise the simulation + TCO pipeline against the committed code on
  # every PR. Module 1 (capability extraction) needs HF Hub access for the WBT
  # datasets and is therefore restricted to the workflow_dispatch pipeline.yml
  # job that supplies HF_TOKEN; module-04 needs Module 1 outputs. Modules 2 and
  # 3 are self-contained — SimPy + closed-form TCO — and can run on every PR.
  # This proves the simulation+TCO surface against the committed code, not just
  # the import-time smoke test that docker-build provides.
  pipeline-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies (locked)
        run: |
          uv sync --frozen --extra dev --extra analytics
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
      - name: Run module_02 simulation
        run: python -m warehouse_humanoid_tco.pipelines.module_02_simulation
      - name: Run module_03 TCO
        run: python -m warehouse_humanoid_tco.pipelines.module_03_tco
      - name: Assert pipeline outputs exist
        run: |
          test -s data/processed/simulation_runs.parquet
          test -s data/processed/tco_scenarios.parquet
          test -s reports/module_02_simulation_report.json
          test -s reports/module_03_tco_report.json

  # Governance audit + Adversary: runs every check_*.py and re-verifies each
  # closed finding's verification_script. A closed finding that regresses fails
  # the PR. Phase 4 expands this into a clean-checkout job.
  governance-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies (locked)
        run: |
          uv sync --frozen --extra dev --extra analytics
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
      - name: Generate simulation data (required for F-044 verification)
        run: python -m warehouse_humanoid_tco.pipelines.module_02_simulation
      - name: make audit
        run: VENV="" make audit
      - name: Adversary — re-verify closed findings
        run: python scripts/check_closed_findings.py
