name: Pipeline

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: pip install uv
      - name: Install dependencies (locked)
        run: |
          uv sync --frozen --extra dev --extra analytics
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
      - name: Ruff
        run: ruff check src/
      - name: Pytest
        run: pytest tests/ -v

  modules:
    name: Run Pipeline
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: pip install uv
      - name: Install dependencies (locked; analytics required for dbt)
        run: |
          uv sync --frozen --extra dev --extra analytics
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
      - name: Prepare data dirs
        run: mkdir -p data/raw data/processed
      - name: Module 1 (capability extraction)
        run: python -m warehouse_humanoid_tco.pipelines.module_01_capability_extraction
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Module 2 (simulation)
        run: python -m warehouse_humanoid_tco.pipelines.module_02_simulation
      - name: Module 3 (TCO)
        run: python -m warehouse_humanoid_tco.pipelines.module_03_tco
      - name: Module 4 (dashboards)
        run: python -m warehouse_humanoid_tco.pipelines.module_04_dashboards
      - name: Build dbt validation marts
        run: dbt build --project-dir analytics/dbt --profiles-dir analytics/dbt
      - uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: |
            data/processed/*.parquet
            reports/*.json
            exports/tableau_public/*.csv
            reports/executive_charts/*.png
          if-no-files-found: warn
          retention-days: 30
