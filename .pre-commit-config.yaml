repos:
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.11

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: ssot-check
        name: SSOT freshness check
        entry: python scripts/check_ssot.py
        language: system
        pass_filenames: false
        always_run: false
        # Must cover every canonical path in governance/SSOT_REGISTRY.yaml.
        # Enforced by scripts/check_ssot_scope.py (F-009).
        files: ^(\.github/workflows/|\.pre-commit-config\.yaml|CHANGELOG\.md|CLAUDE\.md|PROJECT_CHARTER\.md|README\.md|CONTRIBUTING\.md|config/|docs/ADR/|governance/|notebooks/|pyproject\.toml|reports/|scripts/|src/)
