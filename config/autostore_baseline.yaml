architecture: autostore
version: '1.0'
status: calibrated
layout:
  grid_columns: 10
  grid_rows: 10
  bin_depth: 10
  total_bins: 10000
  ports: 4
  robots_per_port: 1
operations:
  shift_hours: 8
  operating_days_per_year: 252
  order_arrival_rate_per_hour: 120
  pick_lines_per_order: 2.5
agents:
  human:
    cycle_time_mean_seconds: 25
    cycle_time_std_seconds: 8
    error_rate: 0.002
    hourly_wage_eur: 18.5
    overhead_multiplier: 1.35
    absence_rate_per_shift: 0.05
  humanoid:
    cycle_time_mean_seconds: null
    cycle_time_std_seconds: null
    error_rate: null
    capex_eur: 120000
    energy_kwh_per_shift: 8.0
    reference_task: pick_medium_object
  amr:
    cycle_time_mean_seconds: 35
    cycle_time_std_seconds: 5
    error_rate: 0.001
    capex_eur: 65000
    mtbf_hours: 4000
    mttr_hours: 2
    energy_kwh_per_shift: 4.0
scenarios:
# S-baseline-human is the legacy overstaffed baseline (explicit 8-human reference).
- id: S-baseline-human
  human_fraction: 1.0
  humanoid_fraction: 0.0
  amr_fraction: 0.0
  agent_counts:
    human: 8
    humanoid: 0
    amr: 0
- id: S-lean-human
  human_fraction: 1.0
  humanoid_fraction: 0.0
  amr_fraction: 0.0
  agent_counts:
    human: 3
    humanoid: 0
    amr: 0
# Frontier-optimal lean mix at λ=120/h (demand_frontier.json::results[0]); F-241.
- id: S-lean-hybrid-amr
  human_fraction: 0.25
  humanoid_fraction: 0.0
  amr_fraction: 0.75
  agent_counts:
    human: 1
    humanoid: 0
    amr: 3
- id: S-pure-humanoid
  human_fraction: 0.0
  humanoid_fraction: 1.0
  amr_fraction: 0.0
  agent_counts:
    human: 0
    humanoid: 11
    amr: 0
- id: S-hybrid-5050
  human_fraction: 0.5
  humanoid_fraction: 0.5
  amr_fraction: 0.0
  agent_counts:
    human: 11
    humanoid: 11
    amr: 0
- id: S-hybrid-amr
  human_fraction: 0.125
  humanoid_fraction: 0.625
  amr_fraction: 0.25
  agent_counts:
    human: 3
    humanoid: 11
    amr: 4
- id: S-future-2028
  human_fraction: 0.5
  humanoid_fraction: 0.5
  amr_fraction: 0.0
  humanoid_throughput_multiplier: 1.3
  agent_counts:
    human: 3
    humanoid: 9
    amr: 0
total_agents: 8
capability_transfer:
  wbt_to_production_factor:
    point_estimate: 0.7
    range:
    - 0.5
    - 0.9
    rationale: 'Early-deployment robotics literature (Boston Dynamics Spot case studies,
      Figure AI pilot disclosures) suggests 50-90% of lab capability in structured
      production environments. We use 70% as the central estimate. This is the primary
      sensitivity parameter driving H3/H4 uncertainty.

      '
    source: Internal assumption; no public benchmark for Unitree G1 in warehouse ops
      as of 2026
humanoid_operational:
  mtbf_hours: 40.0
  mttr_hours: 0.5
  battery_capacity_hours: 4.0
  recharge_time_hours: 1.0
  supervision_ratio: 0.1
  shift_degradation_factor: 0.05
  source: Conservative estimates for early-deployment industrial robotics
amr_operational:
  mtbf_hours: 80.0
  battery_capacity_hours: 6.0
  recharge_time_hours: 0.5
  source: Typical AMR spec from public vendor datasheets (Locus, Geek+)
unmodeled_parameters:
- key: layout.grid_columns
  bias: unknown
  note: Grid geometry is not simulated
  planned: F-222
- key: layout.grid_rows
  bias: unknown
  note: Grid geometry is not simulated
  planned: F-222
- key: layout.bin_depth
  bias: unknown
  note: Bin depth is not simulated
  planned: F-222
- key: layout.total_bins
  bias: unknown
  note: Storage capacity is not simulated
  planned: F-222
- key: layout.robots_per_port
  bias: unknown
  note: Port assignment is not simulated
  planned: F-222
- key: agents.human.error_rate
  bias: favors_robots
  note: Human picking errors are not costed
  planned: F-222
- key: agents.human.absence_rate_per_shift
  bias: favors_robots
  note: Human absence is not modeled
  planned: F-222
- key: agents.humanoid.error_rate
  bias: favors_robots
  note: Humanoid picking errors are not costed
  planned: F-222
- key: agents.amr.error_rate
  bias: favors_robots
  note: AMR errors are not costed
  planned: F-222
- key: agents.amr.mtbf_hours
  bias: favors_robots
  note: AMR failure rate is not simulated
  planned: F-222
- key: agents.amr.mttr_hours
  bias: favors_robots
  note: AMR repair time is not simulated
  planned: F-222
- key: capability_transfer.wbt_to_production_factor.rationale
  bias: neutral
  note: Rationale is documentation rather than a model input
  planned: none
- key: humanoid_operational.shift_degradation_factor
  bias: favors_robots
  note: Humanoid shift degradation is not simulated
  planned: F-222
- key: amr_operational.mtbf_hours
  bias: favors_robots
  note: AMR failure rate is not simulated
  planned: F-222
- key: amr_operational.battery_capacity_hours
  bias: favors_robots
  note: AMR battery capacity is not simulated
  planned: F-222
- key: amr_operational.recharge_time_hours
  bias: favors_robots
  note: AMR recharge time is not simulated
  planned: F-222
