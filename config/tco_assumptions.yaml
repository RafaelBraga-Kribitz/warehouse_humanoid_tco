# TCO financial model assumptions
# All assumptions are configurable for sensitivity analysis.
# See PROJECT_CHARTER.md §7.6 for the sensitivity analysis protocol.
# Source every assumption here. "Source: internal estimate" is forbidden.

financial:
  horizon_years: 5
  discount_rate: 0.08              # Source: conservative WACC estimate for Austrian logistics
  discount_rate_range: [0.04, 0.12]  # Sensitivity range

labor:
  # Source: WKO Kollektivvertrag Spedition & Lagereibetriebe (BG-III 2025/26)
  # https://www.wko.at/service/kollektivvertrag/
  base_hourly_wage_eur: 18.50
  annual_wage_growth_rate: 0.025  # Source: Statistik Austria wage growth trend 2020-2025
  overhead_multiplier: 1.35       # social contributions, holiday, sick pay
  training_cost_per_humanoid_eur: 5000   # operator training per humanoid unit
  training_cost_range: [2000, 10000]

humanoid:
  # Source: market estimates from Unitree G1 pricing + analyst reports
  unit_capex_eur: 120000
  unit_capex_range: [80000, 200000]   # Sensitivity range
  useful_life_years: 7
  residual_value_fraction: 0.10       # 10% residual at end of life
  annual_maintenance_fraction: 0.08   # 8% of capex per year
  financing_rate: 0.045               # Source: Austrian bank leasing rates 2026
  installation_cost_per_unit_eur: 8000
  energy_cost_eur_per_kwh: 0.22      # Source: Statistik Austria industrial tariff 2025

amr:
  unit_capex_eur: 65000
  useful_life_years: 8
  residual_value_fraction: 0.15
  annual_maintenance_fraction: 0.06
  energy_cost_eur_per_kwh: 0.22

infrastructure:
  # AutoStore-specific additions
  grid_expansion_cost_eur_per_bin: 150
  integration_cost_eur: 200000     # one-time system integration
  integration_cost_range: [100000, 400000]

unmodeled_parameters:
  - {key: financial.discount_rate_range, bias: neutral, note: Legacy range is not the active sensitivity range, planned: F-222}
  - {key: labor.training_cost_range, bias: favors_robots, note: Training range is not sampled by the model, planned: F-222}
  - {key: humanoid.unit_capex_range, bias: favors_robots, note: Legacy capex range is not the active sensitivity range, planned: F-222}
  - {key: humanoid.financing_rate, bias: favors_humans, note: Financing costs are not modeled in NPV, planned: F-222}
  - {key: infrastructure.grid_expansion_cost_eur_per_bin, bias: favors_robots, note: Grid expansion cost is excluded from TCO, planned: F-222}
  - {key: infrastructure.integration_cost_range, bias: favors_robots, note: Integration cost range is not sampled, planned: F-222}

# Sensitivity analysis specification — the SINGLE SOURCE OF TRUTH for the OAT
# ranges and Monte-Carlo distributions used by analysis/sensitivity.py.
#
# The previous `sensitivity_parameters` block listed ten parameters (some of
# which — useful_life, financing_rate, wage_growth — the model never sampled)
# while the code hardcoded a different five. The config was decorative. This
# block lists exactly the five continuous parameters the model actually varies,
# and analysis/sensitivity.py reads its ranges/distributions from here. Editing
# a value here changes the sensitivity outputs.
sensitivity:
  oat:                       # one-at-a-time sweep ranges (min, max)
    humanoid_capex_eur: [60000, 180000]
    human_wage_eur: [15.13, 22.00]      # WKO Spedition & Lagereibetriebe BG-III 2025/26 bracket
    human_overhead_mult: [1.0, 1.7]
    discount_rate: [0.04, 0.12]
    transfer_factor: [0.50, 0.90]       # WBT->production capability transfer
    humanoid_supervision_ratio: [0.05, 0.50]
  monte_carlo:               # per-parameter distribution for the 10k-sample MC
    humanoid_capex_eur: {type: lognormal, mean: 120000, std: 30000}
    human_wage_eur: {type: normal, mean: 18.50, std: 2.0}
    human_overhead_mult: {type: uniform, low: 1.0, high: 1.7}
    discount_rate: {type: uniform, low: 0.04, high: 0.12}
    transfer_factor: {type: uniform, low: 0.50, high: 0.90}
    humanoid_supervision_ratio: {type: uniform, low: 0.05, high: 0.50}
  base_point:                # OAT pivot / central estimate
    humanoid_capex_eur: 120000.0
    human_wage_eur: 18.50
    human_overhead_mult: 1.35
    discount_rate: 0.08
    transfer_factor: 0.70
    humanoid_supervision_ratio: 0.10

# Demand frontier specification. Later shifts are separately staffed and use the
# premium when the crew optimizer compares five-year costs.
demand_frontier:
  lambda_per_hour: [120, 200, 300, 400]
  shifts: [1, 2, 3]
  night_shift_premium: 1.5
  target_rho: 0.85
