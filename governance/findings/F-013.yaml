verification_script: tests/governance/test_f013_bootstrap_documented.py
notes: |
  Closure (Phase 0 — this PR): make bootstrap runs `pre-commit install &&
  pre-commit run --all-files`. The test asserts the bootstrap target exists in
  the Makefile and pre-commit is in pyproject.toml [dev] deps (already true).
  The presence of .git/hooks/pre-commit itself is not enforceable in CI (CI
  clones fresh), but make session-start re-checks and warns.
