id: F-024
title: User-facing docs must cite simulation run-counts consistent with the canonical pipeline report
category: numeric_drift
kind: recurrence_invariant
status: closed
opened_at: 2026-05-30
closed_at: 2026-05-30
recurrence_count: 0
evidence: |
  The parallel session's original evidence cited README.md saying "150 runs /
  30 per scenario" while docs + Makefile said 75/15 — describing a drift
  between README and the rest of the repo. Inspection of the current tree at
  ingestion time found this evidence to be wrong: README.md:78 cites
  "15 simulation replicas per scenario", which matches
  reports/module_02_simulation_report.json (n_runs_per_scenario: 15,
  total_runs: 75) and the Makefile + setup docs. The repo is internally
  consistent.
verification_script: tests/governance/test_f024_run_count_docs.py
notes: |
  Closed by reframing the finding from "drift exists, fix it" to "drift must
  not exist, here is the invariant that proves it". The verification reads
  reports/module_02_simulation_report.json (the canonical pipeline output)
  and asserts every user-facing doc citing a run count cites a number drawn
  from {n_runs_per_scenario, total_runs}. If the simulation is later re-run
  with n_runs=30 (yielding total_runs=150), the docs must be updated in the
  same PR or this invariant will trip.
