notes: |
  Closed by restructuring the manifest along the real ownership boundary:
  1. Split the single `unifolm_wbt` meta-entry into five per-subset entries,
     one per actual HF dataset repo. Each carries:
       - the real 40-char hex commit SHA (already pinned in
         config/dataset_manifest.yaml, now duplicated here as the
         documentary register)
       - access_date 2026-05-29 (subdir mtime)
       - a local_dir pointing at the actual G1_* directory
  2. Kept at_wages and wko_kv as URL citations (no local file); populated
     snapshot_date 2026-05-30 (when KV/wage values were latched into
     config/tco_assumptions.yaml).
  3. Strengthened the verification test contract: in addition to banning
     `null`, it now enforces:
       - revision_sha values must be 40-char hex (HF commit SHA format)
       - access_date / snapshot_date values must be ISO-8601 YYYY-MM-DD
     This blocks the failure mode Codex flagged on PR #25 (prose passing the
     null-ban) from ever recurring.
  Previously xfail, now PASSED.
