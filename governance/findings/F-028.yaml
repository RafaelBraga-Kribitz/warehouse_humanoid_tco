id: F-028
title: Simulation never computes or asserts queueing utilisation ρ = λ/(cμ)
category: methodology_drift
kind: recurrence_invariant
status: closed
opened_at: 2026-05-30
closed_at: 2026-05-30
recurrence_count: 0
evidence: |
  Pre-closure: src/warehouse_humanoid_tco/models/simulation.py consumed
  arrival_rate, service times, and server count without computing the
  predicted M/G/c utilisation rho = lambda * E[S] / c. Saturation would only
  be discovered after the 75-run batch finished with queues blowing up.
verification_script: tests/governance/test_f028_utilisation_check.py
notes: |
  Closed by adding queueing-theoretic predicted utilisation to the simulation
  engine:
  1. New `predict_utilisation(scenario)` function in models/simulation.py
     computing rho = lambda * E[S] / c for the heterogeneous M/G/c with
     proportional routing (weighted mean service time across agent types).
  2. `run_scenario` calls it before starting SimPy and raises
     `ValueError(...)` if rho >= RHO_SATURATION_THRESHOLD (=1.0), so a
     saturated configuration fails fast with an actionable message instead
     of running for minutes and producing degenerate queue stats.
  3. `rho_predicted` is added to every run's result dict, persisted in
     data/processed/simulation_runs.parquet and exports/tableau_public/
     simulation_runs.csv, so downstream consumers can observe + plot it.
  Current scenario configuration is comfortably sub-saturation (all
  scenarios show rho in [0.10, 0.16] — well below the 0.95 warn threshold
  and 1.0 saturation threshold).
  Verification: tests/governance/test_f028_utilisation_check.py scans
  simulation.py for `rho` / `utilisation =` / `erlang` / `M/M/c` references.
  Previously xfail, now PASSED. All 13 existing simulation tests still pass.
