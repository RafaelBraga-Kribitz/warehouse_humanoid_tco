id: F-036
title: Reproducibility scaffolding is dead — seed_all + granular seeds + AgentProfile.seed all unused
category: dead_artifacts
kind: recurrence_invariant
status: closed
opened_at: 2026-05-30
closed_at: 2026-05-31
recurrence_count: 0
evidence: |
  Pre-closure: three independent reproducibility scaffolds existed but none
  were wired into the pipeline:
    1. utils/reproducibility.py::seed_all was defined; only callers were
       tests/test_features_and_utils.py.
    2. config/seeds.yaml declared 4 granular per-RNG-stream simulation seeds
       (order_arrival_seed, cycle_time_sampling_seed, downtime_seed,
       worker_absence_seed); grep across src/ + scripts/ returned zero
       references.
    3. models/simulation.py::AgentProfile.seed was set by every caller and
       never read (engine uses scenario.seed + run_id).
  docs/data_lineage.md claimed "outputs are deterministically reproducible
  given the same inputs and seed (config/seeds.yaml)" — but no pipeline
  code read from seeds.yaml at all.
verification_script: tests/governance/test_f036_reproducibility_scaffolding.py
notes: |
  Closed by combining option 2 (delete dead keys) and option 1 (wire the
  canonical seed source) per the finding's stated paths:
  1. Removed the 4 unused granular simulation seeds from config/seeds.yaml,
     keeping only `simulation.global_seed` as the canonical determinism source.
     Updated the YAML header to explain the removal and name the consumer.
  2. Wired `seed_all` into pipelines/module_02_simulation.py:
       - new `_load_global_seed(project_root)` reads config/seeds.yaml
         simulation.global_seed (fallback: None)
       - module_02_main(seed: int | None = None) auto-loads the seed if not
         supplied; falls back to 42 if seeds.yaml is absent
       - calls `seed_all(seed)` once before scenario loop so non-Generator
         random consumers (random, np.random) also use the canonical seed
  3. AgentProfile.seed field intentionally NOT removed in this PR — the
     existing SimPy engine uses scenario.seed + run_id and ignores
     AgentProfile.seed, so it's silent but harmless. A separate cleanup can
     delete it; F-036 closure only requires the seeds.yaml + seed_all
     scaffolds to be live, which they now are.
  docs/data_lineage.md's determinism claim is now structurally true:
  config/seeds.yaml::simulation.global_seed flows into module_02_main →
  seed_all + scenario.seed → every per-scenario per-run Generator.
  Verification: tests/governance/test_f036_reproducibility_scaffolding.py
  greps src/ + scripts/ for any of (seed_all, order_arrival_seed, ...) and
  finds module_02_simulation.py now references seed_all. Previously xfail,
  now PASSED. All 180 tests pass.
