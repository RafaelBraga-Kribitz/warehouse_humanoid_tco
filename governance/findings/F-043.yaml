id: F-043
title: Presentation-layer artifacts (charts, QMD renders) regenerate stale after methodology changes
category: governance_gaps
kind: recurrence_invariant
status: open
opened_at: 2026-05-31
closed_at: null
recurrence_count: 0
evidence: |
  After major methodology changes (e.g., F-033 opex split, F-034 S-future-2028
  differentiation), presentation artifacts diverge from the underlying data:

  1. reports/executive_charts/*.png (cost composition bar, tornado sensitivity
     plots) are manually regenerated via module-04, but no `make` target invokes
     module-04 in isolation after data changes. The `make all` target runs
     modules 01-04 back-to-back, but if a contributor modifies only config or
     analysis code (not module inputs), they must manually re-run module-04 to
     regenerate charts. This creates a window where committed CSV/JSON outputs
     exist but PNG visualizations remain stale.

  2. Quarto documents (reports/*.qmd) render to HTML/PDF only when manually run
     via `quarto render`. Only reports/Executive_Summary_DE.qmd has a dedicated
     `make exec-summary` target; others (module_03_tco_assumptions.qmd, etc.)
     lack `make` targets entirely. Reports may reference stale outputs or data
     fields (e.g., old `total_opex_5yr_eur` vs new `total_opex_5yr_eur_pv`
     split).

  3. No CI gate enforces that checked-in HTML/PDF artifacts match the source
     .qmd + data. A finding-closure PR can update data; the HTML land stale
     because the PR didn't invoke the render step.

  **Evidence of staleness:** After F-033 + F-034, S-future-2028 row in some
  reports may show old capex / opex / NPV values or fail to apply the 1.30
  throughput multiplier. `reports/executive_charts/` PNGs not regenerated.
verification_script: tests/governance/test_f043_presentation_layer_regen.py
notes: |
  To close this finding:

  1. Create a `make presentation` target that:
     - Runs `python -m warehouse_humanoid_tco.pipelines.module_04_dashboards`
     - (If quarto installed) Renders all `reports/*.qmd` to HTML
     - Does NOT re-run modules 01-03 (those are data-generation; module-04 +
       QMD render are display-only)

  2. (Optional) Wire `make presentation` into `make all` after module-04, or
     create a separate CI step that runs `make presentation` on every PR to
     detect stale artifacts.

  3. Add a test that asserts:
     - `make presentation` target exists in Makefile
     - Running it exits 0
     - Verification: `test_f043_presentation_layer_regen.py` checks the target
       exists and is callable (does not verify PNG content; that is a module-04
       concern).

  The closure is minimal — just ensuring the target exists, is wired into CI
  or `make all`, and is documented in `make help`. The actual artifact staleness
  is a side-effect of this gap; once the target exists, contributors have a
  explicit path to refresh them.
