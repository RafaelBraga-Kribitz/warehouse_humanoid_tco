    rebuilds demo.gif from the cast (needs `pip install pyte`) and writes demo.lock.json.
  - docs/assets/demo_scenarios.py sorts by cost and widens the name column for the new names.
  - scripts/generate_tornado_chart.py reads the scenario name from the sensitivity report instead
    of a hard-coded string (the cause of the pre-F-242 mislabel).

  GUARDS (test): banner text spec equals what the current report produces; banner PNG and demo.gif
  match their lock hashes (so hand edits or stale renders fail); demo.cast's ranking table, headline
  and Monte Carlo mean equal the committed reports; every image embedded in README.md is covered by
  the chart manifest, a lock, or an explicit allowlist (this caught the unguarded tornado chart).

  REGENERATE after any model or scenario change:
    python scripts/generate_hero_banner.py
    # re-record docs/assets/demo_run.sh sections if numbers changed, then:
    python scripts/render_demo_gif.py

  NOTE: F-201 (open) still waits for the user's own Figma export; if that arrives, re-run
