verification_script: tests/governance/test_f244_readme_visuals.py
notes: |
  FIX
  - scripts/generate_hero_banner.py repaints only the KPI strip and the ranking table of the
    user-supplied banner from reports/module_03_tco_report.json (7 rows, correct values, winner
    first) and writes docs/assets/hero-banner-v2.lock.json (text spec + PNG sha256).
  - docs/assets/demo.cast sections 2-4 were re-recorded from the real demo scripts (current MC
