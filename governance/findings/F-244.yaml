evidence: >
  After F-242 the README still showed the old S-… codes: docs/assets/hero-banner-v2.png has them
  baked into pixels (KPI strip and a six-row ranking table that predates F-241, with the best-robot
  and cheapest KPI values swapped), and docs/assets/demo.gif replayed a pre-F-241 terminal session
  (five scenarios, old NPVs, a headline claiming a mixed-crew scenario "remains the lowest-NPV scenario"). F-242's guard scanned
  text files only, so raster images slipped through. Owner direction: replace the banner with the
  text-only design-system banner used by the other repositories.
verification_script: tests/governance/test_f244_readme_visuals.py
notes: |
  FIX
  - docs/assets/hero-banner-v2.png is now the text-only Braga design-system banner, generated by
    braga-portfolio-docs (python -m readme_quality hero --name warehouse_humanoid_tco, Söhne from
    braga-design-system-template/system/assets/fonts), exactly like the other portfolio repos.
    It shows only the project title, status, registry descriptor and repository facts: no scenario,
    cost, or percentage, so it cannot go stale. docs/assets/hero-banner-v2.lock.json pins the PNG
    and records its text. (An interim data-repaint of the old Figma banner was replaced by this.)
  - docs/assets/demo.cast sections 2-4 were re-recorded from the real demo scripts (current MC
    summary, 7-scenario ranking sorted by cost, 288 passing tests); scripts/render_demo_gif.py
    rebuilds demo.gif from the cast (needs `pip install pyte`) and writes demo.lock.json.
  - docs/assets/demo_scenarios.py sorts by cost and widens the name column for the new names.
  - scripts/generate_tornado_chart.py reads the scenario name from the sensitivity report instead
    of a hard-coded string (the cause of the pre-F-242 mislabel).

  GUARDS (test): banner PNG matches its lock; banner text names no scenario, retired code, cost or
  percentage; demo.gif matches its lock and demo.cast; the cast's ranking table, headline and
  Monte Carlo mean equal the committed reports; every image embedded in README.md is covered by
  the chart manifest, a lock, or an explicit allowlist (this caught the unguarded tornado chart).

  REGENERATE the demo after any model or scenario change: re-record docs/assets/demo_run.sh
  sections, then `python scripts/render_demo_gif.py`.

  NOTE: F-201 (open) waited for a user-supplied Figma banner; the design-system banner now fills
  the slot the same way as the other repositories. Keep or close F-201 at the owner's discretion.
