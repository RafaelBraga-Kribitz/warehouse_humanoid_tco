[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warehouse-humanoid-tco"
version = "1.0.0"
description = "Humanoid robot TCO analyzer for Austrian intralogistics — portfolio project"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Rafael Braga" }]
requires-python = ">=3.11"
dependencies = [
    "polars[rtcompat]>=0.20",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    "pandera>=0.18",
    "simpy>=4.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "numpy-financial>=1.0",
    "huggingface-hub>=0.22",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    # dbt-core currently constrains pathspec <0.13; Black 26 requires >=1.0.
    "black>=24.0,<26",
    "ruff>=0.4",
    "pyright>=1.1",
    "jupytext>=1.16",
    "pre-commit>=3.7",
]
notebooks = [
    "jupytext>=1.16",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "nbclient>=0.10",
]
analytics = [
    "dbt-duckdb>=1.9",
]

[project.scripts]
warehouse-humanoid-tco = "warehouse_humanoid_tco.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse_humanoid_tco"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "S", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
"scripts/**" = ["S603"]
"scripts/_bootstrap_f200_program.py" = ["E501", "S603"]
"src/warehouse_humanoid_tco/models/simulation.py" = ["ANN401"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/warehouse_humanoid_tco --cov-report=term-missing --cov-fail-under=90"
markers = [
    "integration: marks tests that require file fixtures or full pipeline execution",
]

[tool.coverage.run]
source = ["src/warehouse_humanoid_tco"]
omit = ["*/tests/*", "*/__main__.py"]
